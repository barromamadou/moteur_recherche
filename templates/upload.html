{% extends "base.html" %}
{% block content %}
<div class="container">
    <div class="header">
        <h1><i class="fas fa-upload"></i> Publier une ressource</h1>
        <p class="subtitle">Ajoutez un article, une thèse ou un mémoire au moteur de recherche</p>
    </div>

    <div class="search-container">
        <form method="POST" enctype="multipart/form-data" class="search-box" style="max-width: 600px; margin: auto;">
            <input type="text" name="title" class="search-input" placeholder="Titre du document" required>

            <label style="color: white; margin-top: 10px; display: block;">
                Fichier (PDF, DOCX, TXT) :
                <input type="file" name="file" accept=".pdf,.docx,.txt" style="margin-top: 5px;">
            </label>

            <label style="color: white; margin-top: 15px; display: block;">
                Ou saisissez un texte libre à indexer (optionnel) :
                <textarea name="texte_libre" rows="6" style="width: 100%; margin-top: 5px; border-radius: 8px; padding: 10px;" placeholder="Collez votre texte ici..."></textarea>
            </label>

            <button type="submit" class="search-btn" style="margin-top: 20px;">
                <i class="fas fa-upload"></i> Publier
            </button>
        </form>
    </div>
</div>
{% endblock %}
